      Directly relevant: the fine-tuned model's documented factual error was
      describing the Peloponnesian War as part of the Greco-Persian Wars
      (see MODEL-INTEGRATION.md checkpoint). This is a targeted fix, not
      just general coverage.
    url: https://en.wikisource.org/wiki/History_of_the_Peloponnesian_War

  - id: herodotus-histories
