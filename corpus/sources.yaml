  # --- history: batch 2 (Church history + secular) ---

  - id: bede-ecclesiastical-history
    title: Ecclesiastical History of the English People
    category: history
    translation: A. M. Sellar (1907) or older
    license_status: confirmed_pd
    notes: >
      Major PD medieval Church-history source. The Sellar-translation
      edition (Jane) is the one with full transcluded text; the generic
      title is a short stub.
    url: https://en.wikisource.org/wiki/Ecclesiastical_History_of_the_English_Nation_(Jane)

  - id: council-of-trent
    title: Canons and Decrees of the Council of Trent
    category: history
    translation: J. Waterworth (1848)
    license_status: confirmed_pd
    license_url: https://archive.org/details/TheCanonsAndDecrees
    notes: >
      Extends existing council coverage into the Counter-Reformation, pairs
      with the Protestant confessions above. The J. Waterworth English edition
      was published in London in 1848 and is public domain in the USA. Fetch
      the Internet Archive OCR of that specific edition, selecting only the
      council's primary documents: its Bull of Indiction through the text
      immediately before the index. This deliberately excludes Waterworth's
      historical essays and the scan distributor material.
    url: https://archive.org/download/TheCanonsAndDecrees/TheCanonsAndDecrees_djvu.txt
    format: plain_text
    text_start: '^\s*THE\s*$\n\s*CANONS\s+AND\s+DECREES\s*$\n\s*OF\s+THB\s*$'
    text_end: '^\s*INDEX\s*$'

  - id: thucydides-peloponnesian-war
    title: History of the Peloponnesian War
    category: history
    translation: Richard Crawley (1874)
    license_status: confirmed_pd
