    url: https://en.wikisource.org/wiki/The_Constitution_of_the_Reformed_Dutch_Church_of_North_America/The_Confession_of_Faith

  - id: thirty-nine-articles
    title: Thirty-Nine Articles (1571)
    category: confession
    translation: original English text
    license_status: confirmed_pd
    notes: >
      Church of England foundational document, public domain. Full text is
